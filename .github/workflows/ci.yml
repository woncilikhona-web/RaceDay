name: RaceDay CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore RaceDay.sln

      - name: Build
        run: dotnet build RaceDay.sln -c Release --no-restore

      - name: Publish API
        run: dotnet publish src/RaceDay.Api/RaceDay.Api.csproj -c Release -o publish/api --no-build

      - name: Publish MVC
        run: dotnet publish src/RaceDay.Web/RaceDay.Web.csproj -c Release -o publish/web --no-build

      - name: Save the published files
        uses: actions/upload-artifact@v4
        with:
          name: raceday-publish
          path: publish

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker image
        run: docker build -f src/RaceDay.Api/Dockerfile -t raceday-api:ci .
      - name: Build MVC Docker image
        run: docker build -f src/RaceDay.Web/Dockerfile -t raceday-web:ci .
