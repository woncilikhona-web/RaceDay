name: RaceDay CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Find the solution
        id: sln
        run: |
          SLN=$(find . -name "RaceDay.sln" -not -path "*/docs/*" | head -n 1)
          echo "Found: $SLN"
          if [ -z "$SLN" ]; then
            echo "RaceDay.sln was not found. Upload RaceDay.sln and the src folder to the repo."
            exit 1
          fi
          echo "path=$SLN" >> "$GITHUB_OUTPUT"

      - name: Restore packages
        run: dotnet restore "${{ steps.sln.outputs.path }}"

      - name: Build
        run: dotnet build "${{ steps.sln.outputs.path }}" -c Release --no-restore
